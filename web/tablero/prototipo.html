<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototipo matriz · Horizontes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --azul: #1C4587; --azul-medio: #3F7CC8; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Montserrat, system-ui, sans-serif; color: var(--azul); background: #fff; }
  header { padding: 12px 16px 0; }
  h1 { font-size: clamp(16px, 2.2vw, 40px); font-weight: 800; letter-spacing: .02em; margin: 0; }
  .leyenda { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: clamp(12px, 1.1vw, 22px); padding: 8px 16px 0; color: #4A5D7A; }
  .leyenda span { display: inline-flex; align-items: center; gap: 6px; }
  .pt { width: 1em; height: 1em; border-radius: 50%; display: inline-block; }
  #matriz { width: 100%; max-width: min(100vw, calc(100vh - 90px)); margin: 0 auto; padding: 8px; }
  #matriz svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<header><h1 id="titulo">Priorización de portafolio por horizontes</h1></header>
<div class="leyenda" id="leyenda"></div>
<div id="matriz" aria-live="polite"></div>
<script type="module">
  import { montarMatriz, COLORES } from './matriz/matriz.js';
  const datos = await (await fetch('../../mocks/GET_api_tablero.json')).json();
  document.getElementById('titulo').textContent = datos.grafico?.titulo || 'Priorización de portafolio por horizontes';
  const ley = document.getElementById('leyenda');
  ley.innerHTML = datos.proyectos_vivos.map((v, i) =>
    `<span><i class="pt" style="background:${COLORES.vivos[i]}"></i>${v.nombre}</span>`).join('') +
    `<span><i class="pt" style="background:${COLORES.fijo}"></i>Proyectos de referencia</span>` +
    `<span>Contorno punteado = ronda 1 · sólido = ronda 2</span>`;
  montarMatriz(document.getElementById('matriz'), datos);
</script>
</body>
</html>
